name: Alicorn foundation (macOS)

on:
  push:
  pull_request:

jobs:
  headless:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install supported Odin SDK
        shell: bash
        run: |
          odin_root="$RUNNER_TEMP/alicorn-odin"
          sh tools/setup_macos_odin.sh "$odin_root"
          echo "$odin_root" >> "$GITHUB_PATH"
          echo "ODIN_ROOT=$odin_root" >> "$GITHUB_ENV"
          echo "ALICORN_ODIN=$odin_root/odin" >> "$GITHUB_ENV"

      - name: Install SDL3 for the native host contract test
        run: brew install sdl3

      - name: Report Odin installation
        shell: sh
        run: |
          echo "Odin path: $(command -v odin)"
          odin version

      - name: Build and run foundation checks
        shell: sh
        run: ./tools/check.sh

      - name: Build and run headless native text-input contract
        shell: sh
        run: ./tools/test.sh

      - name: Validate source-over blending through Metal readback
        shell: sh
        run: sh tools/validate_blending.sh

      - name: Smoke-test example runners
        shell: sh
        run: |
          ./tools/run_example.sh 01_hello --idle-validation-seconds=2
          ./tools/run_example.sh 03_async_list --smoke

      - name: Run secondary-window waker teardown under ThreadSanitizer
        shell: bash
        run: |
          REPO_ROOT=$PWD
          . tools/common.sh
          . tools/accesskit.sh
          ODIN=$(alicorn_resolve_odin)
          ACCESSKIT_LINK_FLAGS=$(alicorn_accesskit_linker_flags)
          "$ODIN" test native/sdl_gpu \
            "-extra-linker-flags:$ACCESSKIT_LINK_FLAGS" \
            -define:ODIN_TEST_NAMES=test_secondary_window_wakers_remain_live_until_application_stop \
            -sanitize:thread

      - name: Build and run retained-work benchmark
        shell: sh
        run: ./tools/bench.sh
      - name: Measure flat material and bounded relief geometry
        shell: bash
        run: ./tools/bench_material.sh
