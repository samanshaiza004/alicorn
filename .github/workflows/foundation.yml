name: Alicorn foundation

on:
  push:
  pull_request:

jobs:
  headless:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: nightly
      - name: Cache AccessKit C release
        uses: actions/cache@v4
        with:
          path: .deps/accesskit
          key: accesskit-c-0.23.1-${{ runner.os }}-${{ runner.arch }}
      - name: Build and run foundation tests
        shell: pwsh
        run: ./tools/test.ps1 -Odin odin
      - name: Validate source-over blending through Direct3D 12 readback
        shell: pwsh
        run: ./tools/validate_blending.ps1 -Odin odin
      - name: Compile every example
        shell: pwsh
        run: ./tools/build_examples.ps1 -Odin odin
      - name: Smoke-test example runners
        shell: pwsh
        run: |
          ./tools/run_example.ps1 -Example 01_hello -AppArgs @('--idle-validation-seconds=2')
          ./tools/run_example.ps1 -Example 03_async_list -AppArgs @('--smoke')
      - name: Build and run retained-work benchmark
        shell: pwsh
        run: ./tools/bench.ps1 -Odin odin
      - name: Measure flat material and bounded relief geometry
        shell: pwsh
        run: ./tools/bench_material.ps1 -Odin odin
